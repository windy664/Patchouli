name: CI NeoForge (port 26.2)
on:
  push:
    branches: [ "26.1" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compile Xplat + NeoForge
        run: ./gradlew :Xplat:compileJava :NeoForge:compileJava --no-daemon --stacktrace 2>&1 | tee build.log
        continue-on-error: true
      - name: Show errors
        if: always()
        run: |
          echo "=== ERROR COUNT ==="
          grep -cE "error:" build.log || echo 0
          echo "=== ERRORS (head) ==="
          grep -E "error:|does not exist|cannot find symbol" build.log | head -120 || echo "none"
          echo "=== TAIL ==="
          tail -20 build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
