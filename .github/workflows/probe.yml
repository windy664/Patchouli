name: Probe 26.2 API
on:
  workflow_dispatch:
  push:
    branches: [ "26.1" ]
    paths: [ ".github/workflows/probe.yml" ]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Materialize Minecraft artifacts
        run: ./gradlew :NeoForge:createMinecraftArtifacts --no-daemon --stacktrace
      - name: Probe rendering classes
        run: |
          set +e
          J=$(find /home/runner/work -name 'minecraft-patched-*.jar' | grep -v sources | head -1)
          echo "PATCHED=$J"
          unzip -l "$J" 2>/dev/null | grep -oE '[a-zA-Z0-9/_$]+\.class' > /tmp/idx.txt
          echo "=== classes containing 'BufferSource' ==="
          grep -iE 'BufferSource' /tmp/idx.txt | grep -iE 'net/minecraft|com/mojang' | sort -u | head
          echo "=== classes containing 'MultiBuffer' or 'VertexConsumerProvider' ==="
          grep -iE 'MultiBuffer|VertexConsumerProvider' /tmp/idx.txt | grep -iE 'net/minecraft|com/mojang' | sort -u | head
          echo "=== decompile PictureInPictureRenderer for renderToTexture signature ==="
          VF=$(find /home/runner/.gradle -iname 'vineflower*.jar' 2>/dev/null | grep -viE 'plugin' | head -1)
          echo "VF=$VF"
          PIP=$(grep -iE 'PictureInPictureRenderer\.class$' /tmp/idx.txt | head -1)
          echo "PIP class path: $PIP"
          javap -p -cp "$J" "$(echo $PIP | sed 's#/#.#g; s#\.class$##')" 2>&1 | grep -iE "renderToTexture|render|SubmitNode|BufferSource" | head
          echo "=== javap SubmitNodeCollector ==="
          javap -p -cp "$J" net.minecraft.client.renderer.SubmitNodeCollector 2>&1 | head -30
