name: Probe 26.2 API
on:
  workflow_dispatch:
  push:
    branches: [ "26.1" ]
    paths: [ ".github/workflows/probe.yml" ]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Materialize Minecraft artifacts
        run: ./gradlew :NeoForge:createMinecraftArtifacts --no-daemon --stacktrace
      - name: Probe APIs
        run: |
          set +e
          J=$(find /home/runner/work -name 'minecraft-patched-*.jar' | grep -v sources | head -1)
          echo "PATCHED=$J"
          for FQ in \
            net.minecraft.client.gui.render.pip.PictureInPictureRenderer \
            net.minecraft.client.renderer.feature.FeatureRenderDispatcher \
            net.minecraft.client.renderer.SubmitNodeCollector \
            net.minecraft.client.renderer.SubmitNodeStorage \
            net.minecraft.client.renderer.GameRenderer \
            net.minecraft.client.Minecraft \
            net.minecraft.CrashReportCategory ; do
            echo "################ javap $FQ ################"
            javap -p -cp "$J" "$FQ" 2>&1 | grep -iE "public|protected|renderToTexture|renderAllFeatures|FeatureRenderDispatcher|SubmitNode|getToast|Toast|UNIFORM|setDetail|Lighting|endBatch|bufferSource" | head -30
          done
          echo "################ Minecraft UNIFORM font const ################"
          javap -p -cp "$J" net.minecraft.client.Minecraft 2>&1 | grep -iE "UNIFORM|Font|Identifier .*FONT" | head
      - name: Decompile PictureInPictureRenderer + a sample PiP subclass
        run: |
          set +e
          J=$(find /home/runner/work -name 'minecraft-patched-*.jar' | grep -v sources | head -1)
          VF=$(find /home/runner/.gradle -iname 'vineflower*.jar' 2>/dev/null | grep -viE 'plugin' | head -1)
          mkdir -p /tmp/in /tmp/out
          unzip -o "$J" 'net/minecraft/client/gui/render/pip/*.class' 'net/minecraft/client/renderer/feature/FeatureRenderDispatcher*.class' -d /tmp/in >/dev/null 2>&1
          java -jar "$VF" -dgs=1 /tmp/in /tmp/out >/tmp/vf.log 2>&1
          echo "=== a concrete PiP renderer subclass (renderToTexture body) ==="
          SUB=$(find /tmp/out -name '*Renderer.java' -path '*pip*' | grep -viE 'PictureInPicture\.java' | head -1)
          echo "SUB=$SUB"; sed -n '1,80p' "$SUB" 2>/dev/null
