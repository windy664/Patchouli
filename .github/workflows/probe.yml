name: Probe 26.2 API
on:
  workflow_dispatch:
  push:
    branches: [ "26.1" ]
    paths: [ ".github/workflows/probe.yml" ]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Materialize Minecraft artifacts
        run: ./gradlew :NeoForge:createMinecraftArtifacts --no-daemon --stacktrace
      - name: Probe APIs
        run: |
          set +e
          J=$(find /home/runner/work -name 'minecraft-patched-*.jar' | grep -v sources | head -1)
          echo "PATCHED=$J"
          echo "################ Minecraft: toast (all matches) ################"
          javap -p -cp "$J" net.minecraft.client.Minecraft 2>&1 | grep -iE "toast"
          echo "################ Blocks: CONCRETE (all) ################"
          javap -p -cp "$J" net.minecraft.world.level.block.Blocks 2>&1 | grep -iE "CONCRETE"
          echo "################ Gui: toast accessor ################"
          javap -p -cp "$J" net.minecraft.client.gui.Gui 2>&1 | grep -iE "toast|Toast"
          echo "################ ColorCollection: accessor methods ################"
          javap -p -cp "$J" net.minecraft.world.level.block.ColorCollection 2>&1 | grep -iE "public|get" | head
          echo "################ Minecraft ALL public fields (find toasts) ################"
          javap -p -cp "$J" net.minecraft.client.Minecraft 2>&1 | grep -E "ToastManager|Gui gui|public final" | head -20
          echo "################ SystemReport.setDetail signatures ################"
          javap -p -cp "$J" net.minecraft.SystemReport 2>&1 | grep -iE "setDetail" | head
          echo "################ grep index for uniform font class ################"
          unzip -l "$J" 2>/dev/null | grep -oE '[a-zA-Z0-9/_$]+\.class' | grep -iE 'FontManager|DefaultFonts|FontOption|GuiSpriteManager' | head
          echo "################ ToastManager / Toasts class location ################"
          unzip -l "$J" 2>/dev/null | grep -oE '[a-zA-Z0-9/_$]+\.class' | grep -iE 'ToastManager|/Toasts\.class' | head
      - name: Decompile PictureInPictureRenderer + a sample PiP subclass
        run: |
          set +e
          J=$(find /home/runner/work -name 'minecraft-patched-*.jar' | grep -v sources | head -1)
          VF=$(find /home/runner/.gradle -iname 'vineflower*.jar' 2>/dev/null | grep -viE 'plugin' | head -1)
          mkdir -p /tmp/in /tmp/out
          unzip -o "$J" 'net/minecraft/client/gui/render/pip/*.class' 'net/minecraft/client/renderer/feature/FeatureRenderDispatcher*.class' -d /tmp/in >/dev/null 2>&1
          java -jar "$VF" -dgs=1 /tmp/in /tmp/out >/tmp/vf.log 2>&1
          echo "=== a concrete PiP renderer subclass (renderToTexture body) ==="
          SUB=$(find /tmp/out -name '*Renderer.java' -path '*pip*' | grep -viE 'PictureInPicture\.java' | head -1)
          echo "SUB=$SUB"; sed -n '1,80p' "$SUB" 2>/dev/null
